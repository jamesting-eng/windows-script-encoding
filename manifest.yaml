name: windows-script-encoding
version: 1.27.0
description: "Windows script (.ps1/.bat/.cmd) encoding & line-ending iron rules — stop PowerShell parse-stage failures from recurring (CRLF + pure ASCII, self-check before run); plus launcher, cloud-sync, sandbox-test, i18n, diagram, third-party platform / skill publishing traps, external-auth / cloud-SDK integration rules (client-bound sessions, /.cloud/auth endpoints, server-side dashcam), and front-end layout-debugging iron rules (measure before changing offsets, baseline-align number+unit, headless-screenshot hygiene), Node/TS toolchain traps (spawning .js on Windows / EFTYPE, stale nested deps breaking bundled npm, extensionless ESM output from bundler moduleResolution), document-generation iron rules for HTML to DOCX (a self-referential CSS custom property kills every property using it, an empty div height is dropped by the converter, a modifier class loses to selector specificity, top-level section page breaks are unreliable, acceptance means reading the .docx back; plus absolute headless-screenshot paths and iframe-band capture), and front-end test-visibility / refactor-scope rules (CSS hiding never means unmounted; render scope must be opt-in; a zero-change refactor may not ship behaviour changes silently; cleanup-grep hygiene; an ID-prefix-bound audit count under-counts after rollover; an anchor pasted into the replacement is written back so the old marker survives; a physical-path read can still be stale; a whitespace-only edit can merge or split lines), and deploy-surface exposure (a whole-directory upload makes .gitignore irrelevant, so the guarantee is a runtime deny plus a pre-deploy guard, verified on both sides)"
category: dev-tools
author: jamesting-eng
license: MIT
homepage: https://github.com/jamesting-eng/windows-script-encoding
repository: https://github.com/jamesting-eng/windows-script-encoding
keywords:
  - windows
  - powershell
  - encoding
  - crlf
  - ascii
  - script
  - edgeone
platforms:
  - windows
requirements:
  - Windows 10/11
  - PowerShell 5.1+ (Windows PowerShell) or PowerShell 7+
  - Python 3.10+ (for safe file writing)
